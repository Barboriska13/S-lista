name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Игра в assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          VER=$(grep -oP "const VERSION = 'v\K[0-9.]+" index.html)
          echo "VER=$VER" >> $GITHUB_ENV

      - name: Проверка сборки
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # Ключ подписи хранится в секретах репозитория (KEYSTORE_B64, KEYSTORE_PASS).
      # Один и тот же ключ нужен, чтобы новые версии ставились поверх старых без потери прогресса.
      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Нет секрета KEYSTORE_B64 — добавьте его в Settings → Secrets and variables → Actions"; exit 1; fi
          printf %s "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV

      - name: Сборка
        working-directory: android
        env:
          RAW_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          # пароль без случайных пробелов и переводов строки при вставке
          export KEYSTORE_PASS="$(printf %s "$RAW_PASS" | tr -d ' \r\n\t')"
          gradle --no-daemon assembleRelease

      - name: Выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk S-lista.apk
          TAG="v${VER}-b${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" S-lista.apk --title "С листа ${VER} (сборка ${GITHUB_RUN_NUMBER})" --notes "Android-версия. Скачать: S-lista.apk ниже." --latest
