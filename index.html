<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>С листа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:ital,wght@0,700;0,800;1,500&display=swap">
<style>/*
VOICE: тихий концертный зал вечером — сосредоточенно, без суеты, но с азартом игры.
IDEA: пюпитр со светящейся нотной бумагой в тёмном зале; золотая линия попадания как луч софита.
COLOUR and TYPE: тёплый почти-чёрный, слоновая кость, золото; у каждого раздела свой цвет. Playfair Display — заголовки, Inter — текст, JetBrains Mono — цифры.
LAYOUT: экраны на всю высоту окна, нижняя панель с подсказками клавиш. Размеры в rem — масштаб интерфейса меняет размер шрифта корня.
*/
:root{color-scheme:dark;--bg:#0B0907;--panel:#17130F;--paper:#1C1815;--paper2:#231E1A;--ink:#EFE7D6;--muted:#B3A893;--faint:#7E7364;--line:rgba(233,226,208,.12);--line2:rgba(233,226,208,.24);
--ok:#7ED9A0;--bad:#F0736A;--pitch:#F07F68;--rhythm:#E8B65A;--accent:#D9A441;--sc:#D9A441;
--serif:'Playfair Display',Georgia,serif;--sans:Inter,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--sans);overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
.muted{color:var(--muted)}.small{font-size:.82rem}
.scr{display:none;min-height:100vh;position:relative}.scr.on{display:flex;flex-direction:column;animation:scrIn .24s ease-out}
#scr-game.on{animation-duration:.45s}
@keyframes scrIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.overlay.on{animation:ovIn .18s ease-out}.overlay.on .modal{animation:modIn .2s ease-out}
@keyframes ovIn{from{opacity:0}to{opacity:1}}@keyframes modIn{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
.page{width:100%;max-width:90rem;margin:0 auto;padding:2.2rem clamp(1rem,4vw,3rem) 2rem;flex:1;position:relative;z-index:1}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.6rem;flex-wrap:wrap}
.row2{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.crumb{font-size:.85rem;color:var(--sc)}
.h1{font-size:clamp(2rem,3.6vw,3rem);margin-bottom:.4rem}
.kicker{display:block;font:500 .82rem var(--mono);color:var(--sc);margin-bottom:.4rem}
.lead{max-width:60ch;margin:0 0 1.6rem}
.back{display:inline-flex;align-items:center;gap:.5rem;background:none;border:1px solid var(--line2);border-radius:.4rem;padding:0 .9rem;min-height:2.75rem;cursor:pointer;color:var(--ink);font-weight:600;font-size:.9rem}
.back:hover{border-color:var(--accent)}.back svg{width:1rem;height:1rem}
.pill{display:inline-flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.35rem .8rem}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:3rem;padding:0 1.4rem;border-radius:.4rem;border:1px solid var(--accent);background:var(--accent);color:#1A140C;font-weight:600;cursor:pointer;font-size:1rem;position:relative}
.btn:hover{filter:brightness(1.08)}.btn.ghost{background:none;color:var(--ink);border-color:var(--line2)}.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{min-height:2.5rem;padding:0 1rem;font-size:.9rem}.btn.on{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:default}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.82rem;padding:.3rem .5rem;position:relative}.linkbtn:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.warn{background:rgba(240,115,106,.08);border:1px solid rgba(240,115,106,.35);border-radius:.5rem;padding:.9rem 1.1rem;font-size:.95rem;margin-bottom:1.4rem;display:none}.warn.on{display:block}
.note{font-size:.85rem;color:var(--muted);margin:.4rem 0 0}
.gear{position:fixed;top:1rem;right:1rem;z-index:5;width:2.75rem;height:2.75rem;border-radius:.5rem;border:1px solid var(--line2);background:rgba(11,9,7,.7);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.gear:hover{color:var(--ink);border-color:var(--accent)}.gear svg{width:1.3rem;height:1.3rem}
body.playing .gear,body.inSettings .gear{display:none}
.topbar{padding-right:3.5rem}
/* нижняя панель */
.foot{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-top:1px solid var(--line);padding:.9rem clamp(1rem,4vw,3rem);background:rgba(11,9,7,.9)}
.legend{display:flex;gap:1.3rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:.45rem}
.legend .kbadge{position:static}
.footR{display:flex;align-items:center;gap:1rem}.ver{font:500 .72rem var(--mono);color:var(--faint)}
.actionsBar{padding-top:1rem;padding-bottom:1rem}.acts{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
/* главная */
.homeBg{position:absolute;left:0;right:0;top:52%;height:40%;width:100%;opacity:.22;pointer-events:none}
.home{display:flex;flex-direction:column;justify-content:center;gap:2.6rem}
.logo{font:800 clamp(4rem,9vw,7.5rem)/1 var(--serif);letter-spacing:-.02em}
.tagline{color:var(--muted);margin:.8rem 0 0;font-size:1.05rem}
.homeGrid{display:grid;grid-template-columns:minmax(0,22rem) minmax(0,1fr);gap:clamp(1.5rem,8vw,11rem);align-items:start}
.menu{display:flex;flex-direction:column;gap:.75rem}
.mitem{position:relative;text-align:left;background:rgba(28,24,21,.85);border:1px solid var(--line2);border-radius:.5rem;padding:.8rem 1rem;cursor:pointer;display:flex;flex-direction:column;gap:.1rem}
.mitem>b{font:700 1.2rem var(--serif)}.mitem>span{font-size:.8rem;color:var(--muted)}.mitem:hover{border-color:var(--accent)}
.contCard{position:relative;text-align:left;cursor:pointer;border:1px solid var(--sc);border-radius:.75rem;padding:1.6rem 1.4rem 1.2rem;background:color-mix(in srgb,var(--sc) 9%,#0E0C0A);display:flex;flex-direction:column;gap:1.4rem;max-width:48rem;width:100%;justify-self:end}
.contCard:hover{box-shadow:0 0 0 1px var(--sc),0 0 2.5rem color-mix(in srgb,var(--sc) 25%,transparent)}
.contTop{display:flex;gap:1.6rem;align-items:center}
.contTop small{display:block;font-size:.82rem;color:var(--sc);font-weight:600;margin-bottom:.35rem}
.contTop b{display:block;font:700 clamp(1.6rem,2.4vw,2.2rem)/1.15 var(--serif)}.contSub{display:block;color:var(--muted);font-size:.9rem;margin-top:.35rem}
.contProg small{display:block;font-size:.78rem;color:var(--muted);margin-bottom:.45rem}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem}.segs i{height:.3rem;border-radius:.2rem;display:block;position:relative;overflow:hidden}
.segs i b{position:absolute;inset:0 auto 0 0;display:block}
.emb{display:inline-flex;width:5.5rem;height:3.5rem;flex:none}.emb svg{width:100%;height:100%}.emb.big{width:7.5rem;height:4.5rem}
/* постеры разделов */
.posters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.1rem;margin:.9rem 0 2.2rem}.lvlHead{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-top:1.2rem}.lvlHead h2{font-size:1.5rem}
.poster{position:relative;text-align:left;cursor:pointer;background:#141110;border:1px solid var(--line2);border-radius:.75rem;padding:1.2rem 1.2rem 1.1rem;display:flex;flex-direction:column;gap:.6rem;min-height:19rem}
.poster:hover{border-color:var(--c)}.poster.cur{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,#0E0C0A);box-shadow:0 0 0 1px var(--c)}
.poster.done{border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.poster .n{font:800 3.6rem/1 var(--serif);color:var(--c)}
.poster.locked .n,.poster.locked h2{opacity:.55}.poster.locked .pemb{opacity:.45}
.poster .pemb{height:5rem;display:flex;justify-content:center}.poster .pemb svg{height:100%}
.poster h2{font-size:1.35rem}.poster p{margin:0;font-size:.8rem;color:var(--muted);flex:1}
.poster .pbar{font:500 .74rem var(--mono);color:var(--muted)}.poster .track{margin-top:.35rem}
.poster .prow{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted)}
.poster .state{font-size:.78rem;font-weight:600;color:var(--c);display:flex;align-items:center;gap:.35rem}.poster .state svg,.poster .prow svg{width:1rem;height:1rem;flex:none}.poster.locked .state{color:var(--muted);font-weight:500}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.track{height:.3rem;border-radius:.2rem;background:var(--line)}.track>div{height:100%;width:0;border-radius:.2rem;background:var(--c,var(--accent))}
/* путь раздела */
.secHead{background:color-mix(in srgb,var(--sc) 9%,#0B0907);border-bottom:1px solid var(--line)}
.secHead .page{flex:none;padding-bottom:1.6rem}
.secNav{display:flex;gap:.6rem}
.secTitleRow{display:flex;align-items:center;gap:1.4rem}.secTitleRow>div{flex:1}
.bignum{font:800 clamp(4rem,7vw,6rem)/1 var(--serif);color:var(--sc)}
.secTitleRow p{margin:.2rem 0 0}
.path{display:flex;align-items:flex-start;justify-content:space-between;margin:3.2rem 0 2rem;position:relative}
.path::before{content:'';position:absolute;left:3%;right:3%;top:2.75rem;border-top:2px dotted color-mix(in srgb,var(--sc) 45%,transparent)}
.path .prog{position:absolute;left:3%;top:calc(2.75rem - 2px);height:4px;background:var(--sc);border-radius:2px}
.node{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:.3rem;background:none;border:0;cursor:pointer;padding:0 .2rem;z-index:1;text-align:center}
.node .c{width:5.5rem;height:5.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 1.5rem var(--serif);border:2px solid var(--line2);background:#1A1613;color:var(--muted);position:relative}
.node.passed .c{background:var(--sc);border-color:var(--sc);color:#0B0907}
.node.passed .c svg{width:2.2rem;height:2.2rem}
.node.cur .c{border-color:var(--sc);color:var(--sc);box-shadow:0 0 0 .5rem color-mix(in srgb,var(--sc) 14%,transparent),0 0 2rem color-mix(in srgb,var(--sc) 35%,transparent)}
.node.locked{cursor:default}.node.locked .c svg{width:1.2rem;height:1.2rem}
.node.exam .c{width:6.2rem;height:6.2rem;font-size:1rem}
.node .id{font:500 .72rem var(--mono);color:var(--sc);margin-top:.5rem}
.node .t{font:700 1rem/1.2 var(--serif);color:var(--ink)}.node.locked .t{color:var(--muted)}
.node .s{font-size:.72rem;color:var(--muted)}
.node .kbadge{top:-.4rem;left:calc(50% - 2.9rem)}
.nextStep{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;max-width:46rem;margin:1rem auto 0;background:var(--panel);border:1px solid var(--line2);border-radius:.6rem;padding:1rem 1rem 1rem 1.3rem}
.nextStep small{display:block;font-size:.75rem;color:var(--sc)}.nextStep b{font:700 1.15rem var(--serif)}
/* урок */
.lessonHead{display:flex;justify-content:space-between;gap:2rem;align-items:flex-start}
.rule{max-width:62ch;margin:.4rem 0 1.6rem;font-size:1.02rem;color:#DCD3C2}
.ruleEx{background:var(--paper);border-radius:.6rem;height:12rem;overflow:hidden;margin-bottom:1.4rem}.ruleEx canvas{width:100%;height:100%;display:block}
.exCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem}
.exCard{position:relative;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--line2);border-radius:.6rem;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.5rem;min-height:9rem}
.exCard:hover{border-color:var(--sc)}.exCard.cur{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 8%,var(--panel))}
.exCard small{font:500 .72rem var(--mono);color:var(--sc)}.exCard b{font:700 1.25rem var(--serif)}
.exCard .chip{align-self:flex-start}
.exCard .st{display:flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:600;margin-top:auto}
.exCard .best{font:500 .78rem var(--mono);color:var(--muted)}
.chip{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:.25rem;padding:.1rem .5rem;white-space:nowrap}
.chipd{color:var(--accent);border-color:rgba(217,164,65,.5)}
/* формы */
.form{display:grid;gap:1.1rem;background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:1.4rem;margin-bottom:1.6rem;align-content:start}
.form.slim{max-width:44rem}
.form h3{font-size:1.2rem;margin-top:.4rem;color:var(--accent)}
.setGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(30rem,1fr));gap:1.2rem}
.field{display:grid;grid-template-columns:11rem minmax(0,1fr);align-items:center;gap:1rem}
.field>label,.field>span{color:var(--muted);font-size:.92rem}
.seg{display:inline-flex;flex-wrap:wrap;gap:.35rem}
.seg button{position:relative;background:none;border:1px solid var(--line2);border-radius:.35rem;padding:0 .9rem;min-height:2.6rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#1A140C;font-weight:600}
.range{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;position:relative}
input[type=range]{accent-color:var(--accent);width:min(18rem,100%);height:2.6rem}
.val{font-family:var(--mono);font-size:.92rem;min-width:5ch}
select{font:inherit;font-size:1rem;background:var(--paper2);color:var(--ink);border:1px solid var(--line2);border-radius:.4rem;min-height:2.6rem;padding:0 .7rem;max-width:100%}
input[type=checkbox]{accent-color:var(--accent);width:1.2rem;height:1.2rem}
.check{position:relative;display:flex;align-items:center;gap:.7rem;min-height:2.6rem;cursor:pointer}
.exRow,.lvRow{transition:none}.free-ex .lvRow{display:none}.free-lv .exRow,.free-lv #exNone{display:none}#exNone{display:none}.free-ex.noEx #exNone{display:block}.free-ex.noEx .exRow{display:none}
.melList{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1rem}
.melCard{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:.6rem;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.6rem}
.melCard b{font:700 1.2rem var(--serif)}.melCard .acts{margin-top:auto}
/* игра */
#scr-game.on{height:100vh;min-height:32rem;overflow:hidden}
.gline{height:.25rem;background:var(--line)}.gline div{height:100%;width:0;background:var(--sc)}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;padding:.9rem 1.8rem .6rem}
.gtop>div:first-child{flex:1}
.gtop h2{font-size:1.4rem}.chips{display:flex;gap:.45rem;margin-top:.4rem;flex-wrap:wrap}
.gscore{display:flex;flex-direction:column;align-items:flex-end}.gscore b{font:700 2.6rem/1 var(--mono);letter-spacing:.02em}.gscore span{font:500 .8rem var(--mono);color:var(--muted);margin-top:.35rem;white-space:nowrap}
.icon{display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;border-radius:.4rem;border:1px solid var(--line2);background:none;cursor:pointer;color:var(--ink)}.icon svg{width:1.1rem;height:1.1rem}
.stage{flex:1;position:relative;min-height:14rem}.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.retryOv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:rgba(0,0,0,0);pointer-events:none;opacity:0;font-weight:600}
.retryOv svg{width:7rem;height:7rem;transform:rotate(-90deg)}.retryOv .rbg{fill:none;stroke:rgba(239,231,214,.18);stroke-width:8}.retryOv .rfg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:301.6;stroke-dashoffset:301.6}
.cdOv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(8,6,5,0);transition:background .25s,opacity .3s;opacity:0}
.cdOv.on{opacity:1;background:rgba(8,6,5,.12)}
.cdOv span{font:800 clamp(7rem,30vh,16rem)/1 var(--serif);color:var(--accent);opacity:.75;text-shadow:0 0 3rem rgba(217,164,65,.45)}
.cdOv span.pop{animation:cdpop .5s ease-out}@keyframes cdpop{0%{transform:scale(1.25);opacity:.4}25%{opacity:1}100%{transform:scale(1);opacity:.75}}
.gbottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,26rem) minmax(0,1fr);align-items:center;gap:1.5rem;padding:.4rem 1.8rem .3rem}
.combo{display:flex;align-items:baseline;gap:.6rem}.combo b{font:800 3.2rem/1 var(--serif)}.combo span{font-size:.75rem;color:var(--muted)}
.hitbar{display:flex;flex-direction:column;gap:.35rem}
.hbTrack{position:relative;height:.9rem;border-radius:.45rem;background:rgba(232,182,90,.18);overflow:visible}
.hbTrack .z{position:absolute;top:0;bottom:0;border-radius:.45rem}.hbTrack .z.good{background:rgba(232,182,90,.35)}.hbTrack .z.great{background:rgba(126,217,160,.35)}.hbTrack .z.perfect{background:rgba(126,217,160,.6)}
.hbTrack .mid{position:absolute;left:50%;top:-.25rem;bottom:-.25rem;width:2px;margin-left:-1px;background:var(--ink)}
.hbTrack .tick{position:absolute;top:-.15rem;bottom:-.15rem;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.hbTrack .avg{position:absolute;top:-.75rem;width:0;height:0;border-left:.35rem solid transparent;border-right:.35rem solid transparent;border-top:.45rem solid var(--accent);margin-left:-.35rem;left:50%;transition:left .2s}
.hbLab{display:flex;justify-content:space-between;font:500 .7rem var(--mono);color:var(--muted)}
.glegend{display:flex;flex-direction:column;align-items:flex-end;gap:.35rem;font-size:.78rem;color:var(--muted)}.glegend span{display:inline-flex;gap:.5rem;align-items:center}.glegend .kbadge{position:static}
.kbd{display:flex;flex-direction:column;gap:.35rem;padding:.2rem 1.8rem 1rem}
.kbd .t{display:flex;justify-content:space-between;gap:.8rem;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.kbd svg{width:100%;height:5.4rem;display:block}
.kw{fill:#EFE7D6}.kb{fill:#120F0D}.k-ok{fill:var(--ok)}.k-bad{fill:var(--pitch)}.k-neutral{fill:var(--accent)}
.kl{font:700 14px var(--sans);fill:#221C17}.klb{font:700 12px var(--sans);fill:#EFE7D6}
.k-next{fill:#E9CF94}rect.kb.k-next{fill:#8A6A2A}
.blink{color:var(--accent)!important;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.35}}
body.pagemode .gbottom{display:none}body.pagemode .kbd{display:none}body.pagemode.kbmode .kbd{display:flex}body.pagemode.kbmode .kbd svg{height:3.8rem}
body.waitmode .hitbar{visibility:hidden}
/* итоги */
.resGrid{display:grid;grid-template-columns:minmax(0,17rem) minmax(0,1fr) minmax(0,1.15fr);gap:2rem;margin-top:1.8rem;align-items:start}
.verdict{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.7rem;padding:1rem 0}
.verdict .grade{font:800 clamp(7rem,11vw,10rem)/1 var(--serif);color:var(--gc,var(--accent));text-shadow:0 0 3rem color-mix(in srgb,var(--gc,var(--accent)) 35%,transparent)}
.verdict .grade.ss{text-shadow:0 0 1.5rem #FFE39A,0 0 4rem rgba(255,227,154,.6)}
.verdict .big{width:8.5rem;height:8.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid currentColor}
.verdict .big svg{width:4rem;height:4rem}
.verdict .vt{font:700 1.6rem var(--serif)}.verdict .why{font-size:.88rem;color:var(--muted);max-width:18rem}
.verdict .rec{font-size:.82rem;color:var(--accent);border:1px solid rgba(217,164,65,.5);border-radius:.35rem;padding:.3rem .7rem}
.accs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem;margin-bottom:1.4rem}
.acard{background:var(--panel);border-radius:.5rem;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.3rem}
.acard>span{font-size:.8rem;color:var(--muted)}.acard b{font:700 1.9rem var(--mono)}.acard small{font-size:.75rem;color:var(--muted)}
.acard.sc{grid-column:span 2}
.acard .thr{position:relative;height:.4rem;border-radius:.2rem;background:var(--line);margin-top:.2rem}.acard .thr .fill{height:100%;border-radius:.2rem;background:var(--accent);width:0}
.acard .thr .mark{position:absolute;top:-.3rem;bottom:-.3rem;width:2px;background:var(--ink);margin-left:-1px}
.acard.good b,.acard.good .need{color:var(--ok)}.acard.good .thr .fill{background:var(--ok)}
.acard.fail b,.acard.fail .need{color:var(--bad)}.acard.fail .thr .fill{background:var(--bad)}
.acard.na{opacity:.5}.acard.na b{font:500 1rem var(--sans);padding:.5rem 0}.acard.na .thr{display:none}
.counts{display:grid;gap:.45rem}
.crow{display:grid;grid-template-columns:11.5rem minmax(0,1fr) 2.5rem;align-items:center;gap:.8rem;font-size:.82rem}
.crow i{display:block;height:.4rem;border-radius:.2rem;background:var(--line);position:relative;overflow:hidden}.crow i b{position:absolute;inset:0 auto 0 0;border-radius:.2rem}
.crow em{font:600 .82rem var(--mono);font-style:normal;text-align:right}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:1rem 1.1rem;margin-bottom:1rem}
.panel h3{font:700 1rem var(--sans);margin-bottom:.3rem}
#rHist{width:100%;height:8.5rem;display:block;margin-top:.4rem}
.histAx{display:flex;justify-content:space-between;font:500 .68rem var(--mono);color:var(--muted)}
.heat{display:flex;gap:2px;margin:.6rem 0}.heat i{flex:1;height:.55rem;border-radius:2px;background:var(--line);position:relative}.heat i.sel{outline:1px solid var(--ink);outline-offset:1px}
.fragCv{height:7.5rem;border-radius:.4rem;overflow:hidden;background:var(--paper)}.fragCv canvas{width:100%;height:100%;display:block}
.tips{list-style:none;margin:.8rem 0 0;padding:0;display:grid;gap:.5rem;font-size:.86rem}.tips li{display:flex;gap:.55rem}.tips li::before{content:'';flex:none;width:.45rem;height:.45rem;margin-top:.45rem;border-radius:50%;background:var(--accent)}
.tips li.r::before{background:var(--rhythm)}.tips li.p::before{background:var(--pitch)}
.fragBtns{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}
/* клавиши-подписи */
.kb-host{position:relative}
.kbadge{position:absolute;top:-.6rem;left:-.4rem;z-index:3;display:inline-flex;align-items:center;gap:.25rem;font:700 .7rem/1 var(--mono);color:#1A140C;background:var(--accent);border-radius:.25rem;padding:.2rem .32rem .2rem .25rem;pointer-events:none;box-shadow:0 1px 0 rgba(0,0,0,.4);white-space:nowrap}
.kbadge i{display:inline-block;width:.38rem;height:.62rem;border-radius:1px;border:1px solid #1A140C}.kbadge i.wk{background:#EFE7D6}.kbadge i.bk{background:#1A140C}
.kbadge.kb-l{left:auto;right:calc(100% - 1.4rem);top:-.7rem}.kbadge.kb-r{left:auto;right:-.4rem;top:-.7rem}
.kbadge.static{position:static}
.kb-flash{outline:3px solid var(--accent)!important;outline-offset:2px}
body:not(.midinav) .legend .kbadge,body:not(.midinav) .glegend .midiOnly{display:none}
.ktable{width:100%;font-size:.92rem;border-collapse:collapse}.ktable td{padding:.35rem .25rem;border-bottom:1px solid var(--line)}.ktable td:first-child{width:6rem}.ktable tr.hi td{color:var(--accent);font-weight:600}
.ktable th{text-align:left;font:600 .78rem var(--sans);color:var(--muted);padding:.8rem .25rem .3rem}
/* оверлеи */
.overlay{position:fixed;inset:0;background:rgba(8,6,5,.84);display:none;align-items:center;justify-content:center;z-index:10;padding:1rem}.overlay.on{display:flex}
.modal{background:var(--paper);border:1px solid var(--line2);border-radius:.7rem;padding:1.7rem;width:min(28rem,100%);display:flex;flex-direction:column;gap:.9rem;max-height:94vh;overflow:auto}
.modal.wide{width:min(40rem,100%)}.modal h2{font-size:1.8rem}.modal p{margin:0}
.modal.cal{width:min(46rem,100%)}
.keyStaff{height:15rem;background:var(--paper);border-radius:.5rem;overflow:hidden}.keyStaff canvas{width:100%;height:100%;display:block}#keyText{font-size:1.15rem}
.onbTop{display:flex;justify-content:space-between;align-items:center;gap:.8rem}
.onb h2{font-size:1.9rem;margin:.4rem 0 .1rem}
.onbPic{margin:.4rem 0}
.onbKeys{display:flex;justify-content:center;margin:.4rem 0}
/* калибровка */
.calMeter{display:flex;align-items:center;gap:1.8rem;margin:.6rem 0}
.calBall{width:6rem;height:6rem;border-radius:50%;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font:800 2.2rem var(--serif);color:var(--accent);flex:none;transition:transform .08s,box-shadow .08s}
.calBall.beat{transform:scale(1.08);box-shadow:0 0 1.6rem rgba(217,164,65,.6)}
.calDots{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}.calDots i{width:.9rem;height:.9rem;border-radius:50%;border:1px solid #5a4b38}
.calDots i.warm{background:#5a4b38;border-color:#5a4b38}.calDots i.done{background:var(--ok);border-color:var(--ok)}.calDots i.miss{background:none;border-color:var(--bad)}.calDots i.now{border:2px solid var(--accent)}
.calChart{width:100%;height:13rem;display:block;margin:.4rem 0}
.calWarn{color:var(--rhythm);font-size:.9rem}
.acts.right{justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:5rem;transform:translate(-50%,20px);background:var(--paper2);border:1px solid var(--line2);color:var(--ink);padding:.75rem 1.25rem;border-radius:.5rem;opacity:0;transition:opacity .2s,transform .2s;z-index:30;pointer-events:none;font-weight:500}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.posters{grid-template-columns:repeat(3,minmax(0,1fr))}.resGrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.resRight{grid-column:span 2}}
@media(max-width:760px){.homeGrid{grid-template-columns:minmax(0,1fr)}.contCard{justify-self:stretch}.posters{grid-template-columns:minmax(0,1fr)}.path{flex-wrap:wrap;gap:1rem}.path::before,.path .prog{display:none}.node{flex:0 0 30%}.resGrid{grid-template-columns:minmax(0,1fr)}.resRight{grid-column:auto}.field{grid-template-columns:minmax(0,1fr);gap:.4rem}.gbottom{grid-template-columns:minmax(0,1fr)}.glegend{display:none}.setGrid{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

// ===== Мост MIDI для Android-приложения (WebView не умеет Web MIDI) =====
// В APK Java-код добавляет объект window.AndroidMidi и присылает ноты через window.__amidi.
// В браузере и exe этого объекта нет, и файл ничего не делает.
(function () {
  if (!window.AndroidMidi) return;
  const inputs = new Map();
  const access = { inputs, outputs: new Map(), sysexEnabled: false, onstatechange: null };
  function sync() {
    let list = [];
    try { list = JSON.parse(window.AndroidMidi.devices() || '[]'); } catch (e) { list = []; }
    const ids = new Set(list.map(d => String(d.id)));
    for (const id of [...inputs.keys()]) if (!ids.has(id)) inputs.delete(id);
    list.forEach(d => {
      const id = String(d.id);
      if (!inputs.has(id)) inputs.set(id, { id, name: d.name || 'MIDI', type: 'input', state: 'connected', connection: 'open', onmidimessage: null });
    });
  }
  window.__amidi = {
    msg(id, a, b, c) {
      const inp = inputs.get(String(id));
      if (inp && inp.onmidimessage) inp.onmidimessage({ data: new Uint8Array([a, b, c]), timeStamp: performance.now(), target: inp });
    },
    changed() { sync(); access.onstatechange && access.onstatechange({ port: null }); },
  };
  const req = function () { sync(); return Promise.resolve(access); };
  try { Object.defineProperty(navigator, 'requestMIDIAccess', { value: req, configurable: true, writable: true }); } catch (e) { navigator.requestMIDIAccess = req; }
})();

  'S.notes.title': 'Ноты и знаки', 'S.notes.sub': 'Ноты в обоих ключах, добавочные линейки, знаки альтерации — диезы, бемоли, бекары, дубль-знаки — и ключевые знаки.',

  // --- уроки ---
  'L.n1.title': 'Скрипичный ключ', 'L.n1.rule': 'Ноты стоят на линейках и между ними. Держи в голове ориентиры: соль — на второй линейке, там, где закручивается скрипичный ключ; до первой октавы — на добавочной линейке под станом. Найди ближайший ориентир и отсчитай от него.', 'L.n1.e0': 'От до до до', 'L.n1.e1': 'Весь стан', 'L.n1.e2': 'В темпе',
  'L.n2.title': 'Добавочные линейки', 'L.n2.rule': 'Ноты выше и ниже стана пишутся на коротких добавочных линейках. Считай их как продолжение стана: линейка, промежуток, линейка. Ля над станом — на первой добавочной, до третьей октавы — на второй.', 'L.n2.e0': 'Над станом', 'L.n2.e1': 'Под станом и над ним', 'L.n2.e2': 'В темпе',
  'L.n3.title': 'Басовый ключ', 'L.n3.rule': 'Басовый ключ отмечает фа малой октавы: это четвёртая линейка, между двумя точками ключа. Ещё ориентиры: соль большой октавы — на нижней линейке, до первой октавы — на добавочной линейке над станом.', 'L.n3.e0': 'Ноты басового ключа', 'L.n3.e1': 'С добавочными линейками', 'L.n3.e2': 'В темпе',
  'L.n5.title': 'Знаки альтерации', 'L.n5.rule': 'Диез (♯) повышает ноту на полтона — ближайшая клавиша справа, бемоль (♭) понижает на полтона — ближайшая клавиша слева.', 'L.n5.e0': 'Диезы и бемоли', 'L.n5.e1': 'В басовом ключе', 'L.n5.e2': 'В темпе',
  'L.nc.title': 'Знак до конца такта', 'L.nc.rule': 'Случайный знак действует до конца такта на все такие же ноты в той же октаве: если в такте стоит фа-диез, следующая фа в этом такте — тоже диез, даже без знака. Тактовая черта отменяет знак: в новом такте фа снова обычная.', 'L.nc.e0': 'Знак держится', 'L.nc.e1': 'Новый такт — без знака', 'L.nc.e2': 'В темпе, басовый ключ',
  'L.nn.title': 'Бекар', 'L.nn.rule': 'Бекар (♮) отменяет знак — играем обычную белую клавишу. Он тоже действует до конца такта. Если после бекара снова стоит диез или бемоль, знак возвращается. В нотах иногда ставят напоминающие знаки в скобках, но по правилу они не обязательны.', 'L.nn.e0': 'Отмена знака', 'L.nn.e1': 'Знак — бекар — знак', 'L.nn.e2': 'В темпе, басовый ключ',
  'L.nd.title': 'Дубль-диез и дубль-бемоль', 'L.nd.rule': 'Дубль-диез (𝄪) повышает ноту на целый тон — на две клавиши вправо, дубль-бемоль (𝄫) понижает на целый тон. Фа-дубль-диез — это клавиша соль, си-дубль-бемоль — клавиша ля. Дубль-знак тоже действует до конца такта; если после него стоит обычный диез — нота опускается на полтона.', 'L.nd.e0': 'Дубль-диез', 'L.nd.e1': 'Дубль-бемоль', 'L.nd.e2': 'Вперемешку в темпе',
  'L.n6.title': 'Ключевые знаки', 'L.n6.rule': 'Знаки в начале строки — ключевые: они действуют на все такие ноты во всех октавах до конца пьесы. Прежде чем играть, назови их про себя: «фа-диез» или «си-бемоль». Бекар отменяет ключевой знак только до конца такта.', 'L.n6.e0': 'Один знак', 'L.n6.e1': 'Два знака', 'L.n6.e2': 'Бекар при ключевых знаках', 'L.n6.e3': 'В темпе, басовый ключ',
  'L.nx.title': 'Экзамен', 'L.nx.rule': 'Две пьесы: правой рукой в скрипичном ключе и левой — в басовом. Ключевые и случайные знаки, бекары. Не останавливайся: если ошибся, играй дальше.', 'L.nx.e0': 'Правая рука', 'L.nx.e1': 'Левая рука',
  'L.r1.title': 'Повторы', 'L.r1.rule': 'Несколько нот подряд на одной высоте — это одна и та же клавиша. Увидел ровную «дорожку» из нот — не перечитывай каждую, просто повторяй.', 'L.r1.e0': 'Дорожки', 'L.r1.e1': 'В темпе', 'L.r1.e2': 'С восьмыми',
  'L.r2.title': 'Раскачивание', 'L.r2.rule': 'Мелодия «качается» между двумя соседними нотами: одна на линейке, другая в соседнем промежутке. Пальцы стоят на соседних клавишах и чередуются.', 'L.r2.e0': 'Качели', 'L.r2.e1': 'В темпе', 'L.r2.e2': 'Басовый ключ',
  'L.r3.title': 'Секунды', 'L.r3.rule': 'Секунда — шаг на соседнюю ноту: с линейки в промежуток рядом или обратно. Следи только за направлением: вверх или вниз.', 'L.r3.e0': 'Шаги', 'L.r3.e1': 'В темпе', 'L.r3.e2': 'Басовый ключ',
  'L.r4.title': 'Кляксы', 'L.r4.rule': 'Если два соседних звука взяты вместе, головки нот стоят вплотную по разные стороны штиля и похожи на «кляксу». Это секунда: две соседние клавиши сразу. Звучит резко — так композиторы изображают стук, кваканье, сигналы.', 'L.r4.e0': 'Кляксы', 'L.r4.e1': 'В басовом ключе', 'L.r4.e2': 'В темпе',
  'L.rx.title': 'Экзамен', 'L.rx.rule': 'Повторы, качели, шаги и кляксы: одна пьеса правой рукой, одна левой.', 'L.rx.e0': 'Правая рука', 'L.rx.e1': 'Левая рука',
  'L.s1.title': 'Бусины', 'L.s1.rule': 'В пассаже по гамме нота на линейке всегда сменяется нотой между линейками, и наоборот. Не нужно читать каждую ноту: найди первую, а дальше веди глазами по рисунку.', 'L.s1.e0': 'Пять нот вверх', 'L.s1.e1': 'Пассажи разной длины', 'L.s1.e2': 'В темпе',
  'L.s2.title': 'Гора и впадина', 'L.s2.rule': 'Мелодия может подниматься «в гору», спускаться «с горы» или поворачивать. Следи, где рисунок меняет направление, и вовремя поворачивай вместе с ним.', 'L.s2.e0': 'Спуск с горы', 'L.s2.e1': 'Горы и впадины', 'L.s2.e2': 'В темпе',
  'L.s3.title': 'Басовый ключ', 'L.s3.rule': 'Правило «линейка — промежуток» работает в любом ключе. Найди первую ноту в басовом ключе и веди рисунок так же, как в скрипичном.', 'L.s3.e0': 'Вверх в басовом', 'L.s3.e1': 'Горы и впадины', 'L.s3.e2': 'В темпе',
  'L.s4.title': 'Ритм', 'L.s4.rule': 'Теперь у нот разные длительности. Смотри не столько на высоту — её ты уже читаешь по рисунку, — сколько на длительности. Ноты и ритм оцениваются отдельно.', 'L.s4.e0': 'Четверти и половинные', 'L.s4.e1': 'Восьмые', 'L.s4.e2': 'Паузы и точки',
  'L.s5.title': 'Длинные пассажи', 'L.s5.rule': 'Если в пассаже больше пяти нот, на одну позицию руки их не хватит. Цифры над нотами — аппликатура: с какого пальца начать и где подложить первый палец.', 'L.s5.e0': 'Гамма вверх', 'L.s5.e1': 'Вверх и вниз', 'L.s5.e2': 'Левой рукой',
  'L.s6.title': 'Ловушки', 'L.s6.rule': 'Прежде чем играть, посмотри на ключевые знаки: они действуют на всю пьесу. Случайный знак действует только до конца такта.', 'L.s6.e0': 'Соль мажор', 'L.s6.e1': 'Фа мажор', 'L.s6.e2': 'Случайные знаки',

// ===== Аппликатура: поиск самого удобного пути (динамическое программирование) =====
// Для пары пальцев (a<b) правой руки — удобные интервалы в полутонах от пальца a к пальцу b:
// [MinPrac, MinComf, MinRel, MaxRel, MaxComf, MaxPrac] (по мотивам модели Parncutt и др., 1997)
const SPAN = {
  '1-2': [-5, -3, 1, 5, 8, 10], '1-3': [-4, -2, 3, 7, 10, 12], '1-4': [-3, -1, 5, 9, 12, 14], '1-5': [-1, 1, 7, 10, 13, 15],
  '2-3': [1, 1, 1, 2, 3, 5], '2-4': [1, 1, 3, 4, 5, 7], '2-5': [2, 2, 5, 6, 8, 10], '3-4': [1, 1, 1, 2, 2, 4], '3-5': [1, 1, 3, 4, 5, 7], '4-5': [1, 1, 1, 2, 3, 5],
};
const isBlack = m => [1, 3, 6, 8, 10].includes(Math.abs(m) % 12);

// стоимость перехода палец a → палец b при интервале i (правая рука; для левой i зеркалится)
function stepCost(a, b, i, mFrom, mTo) {
  let c = 0;
  // прыжок шире охвата руки — это перенос руки: цена одна для любых пальцев,
  // палец выбирается под удобство следующих нот; тот же палец подряд — чуть дороже
  if (Math.abs(i) > 12) {
    c = 4 + (a === b ? 2 : 0);
    if (isBlack(mTo) && b === 1) c += 2;
    if (isBlack(mTo) && b === 5) c += 1;
    return c;
  }
  if (a === b) c += i === 0 ? 0.5 : 12 + Math.abs(i);
  else if (i === 0) c += 4; // смена пальца на повторяющейся ноте — только если очень нужно
  else {
    const lo = Math.min(a, b), hi = Math.max(a, b), s = SPAN[lo + '-' + hi], d = a < b ? i : -i;
    const [minP, minC, minR, maxR, maxC, maxP] = s, thumb = lo === 1;
    if (thumb && d < 0) {
      // подкладывание первого пальца / перенос через него: допустимо, но дороже обычного шага
      c += 3.5 + 0.6 * (-d) + (hi === 5 ? 6 : hi === 4 ? 0.8 : 0);
      if (d < minP) c += 10 * (minP - d);
    } else {
      if (d < minC) c += 2 * (minC - d); if (d > maxC) c += 2 * (d - maxC);
      if (d < minP) c += 10 * (minP - d); if (d > maxP) c += 10 * (d - maxP);
      if (d < minR) c += (thumb ? 2 : 1) * (minR - d); if (d > maxR) c += (thumb ? 1 : 2) * (d - maxR);
    }
    if ((a === 3 && b === 4) || (a === 4 && b === 3) || (a === 4 && b === 5) || (a === 5 && b === 4)) c += 1;
  }
  if (b === 4) c += 0.5;
  if (isBlack(mTo) && b === 1) c += 2;
  if (isBlack(mTo) && b === 5) c += 1;
  if (b === 1 && a !== 1 && isBlack(mFrom) && !isBlack(mTo) && i !== 0) c += 0.5;
  return c;
}

// все способы поставить пальцы на созвучие из k нот (по возрастанию высоты)
const COMBOS = {};
function combos(k) {
  if (COMBOS[k]) return COMBOS[k];
  const out = [], rec = (start, acc) => { if (acc.length === k) { out.push(acc.slice()); return; } for (let f = start; f <= 5; f++) { acc.push(f); rec(f + 1, acc); acc.pop(); } };
  rec(1, []); return (COMBOS[k] = out);
}

// внутренняя стоимость аккорда: растяжка между соседними пальцами
function chordCost(fs, ms) {
  let c = 0;
  if (fs.length > 2 && ms[ms.length - 1] - ms[0] >= 7) c += (fs[0] !== 1 ? 1.5 : 0) + (fs[fs.length - 1] !== 5 ? 1.5 : 0);
  // широкий двузвучный интервал (от сексты): крайние пальцы 1 и 5, от октавы — только они
  if (fs.length === 2 && ms[1] - ms[0] >= 9) c += (fs[0] !== 1 ? 1 : 0) + (fs[1] !== 5 ? 1 : 0) + (ms[1] - ms[0] >= 12 && (fs[0] !== 1 || fs[1] !== 5) ? 20 : 0);
  for (let j = 1; j < fs.length; j++) {
    const s = SPAN[fs[j - 1] + '-' + fs[j]], d = ms[j] - ms[j - 1];
    if (d > s[4]) c += 2 * (d - s[4]); if (d > s[5]) c += 10 * (d - s[5]); if (d < s[1]) c += 2 * (s[1] - d);
    if (d < s[2]) c += s[2] - d; if (d > s[3]) c += d - s[3];
  }
  return c;
}

// fingers одной руки: events — события одной строчки (без пауз), hand 'R' | 'L'
function fingerLine(events, hand) {
  const L = hand === 'L';
  const items = events.map(ev => {
    const ms = ev.notes.map(n => midiOf(n.d, n.alt)).sort((a, b) => a - b);
    // для левой руки отражаем высоты: тогда та же модель работает зеркально
    const mm = L ? ms.map(m => -m).sort((a, b) => a - b) : ms;
    return { ev, ms, mm, states: combos(Math.min(5, mm.length)) };
  });
  if (!items.length) return;
  let prev = items[0].states.map(fs => ({ fs, cost: 5 * chordCost(fs, items[0].mm) + (fs[0] === 1 && items[0].mm.length === 1 ? 0.3 : 0), back: -1 }));
  const table = [prev];
  for (let t = 1; t < items.length; t++) {
    const A = items[t - 1], B = items[t];
    const cur = B.states.map(fs => {
      const inner = 5 * chordCost(fs, B.mm);
      let best = Infinity, bi = 0;
      prev.forEach((p, pi) => {
        // переход оцениваем по нижнему и верхнему голосу созвучий
        let c = stepCost(p.fs[0], fs[0], B.mm[0] - A.mm[0], A.mm[0], B.mm[0]);
        if (p.fs.length > 1 || fs.length > 1) c = (c + stepCost(p.fs[p.fs.length - 1], fs[fs.length - 1], B.mm[B.mm.length - 1] - A.mm[A.mm.length - 1], A.mm[A.mm.length - 1], B.mm[B.mm.length - 1])) / 2;
        // после паузы рука может свободно сменить позицию
        if (B.ev.afterRest) c *= 0.3;
        const tot = p.cost + c;
        if (tot < best) { best = tot; bi = pi; }
      });
      return { fs, cost: best + inner, back: bi };
    });
    table.push(cur); prev = cur;
  }
  let bi = 0; prev.forEach((p, i) => { if (p.cost < prev[bi].cost) bi = i; });
  for (let t = items.length - 1; t >= 0; t--) {
    const st = table[t][bi], it = items[t];
    // fs идут по возрастанию отражённых высот; переводим обратно к порядку нот события
    const byMidi = new Map();
    it.mm.forEach((m, j) => byMidi.set(L ? -m : m, st.fs[j] || 5));
    it.ev.fing = it.ev.notes.map(n => byMidi.get(midiOf(n.d, n.alt)));
    bi = st.back;
  }
}

// Какие цифры показывать в режиме «подсказки»: начало строки, после паузы и там, где рука меняет позицию
function markFingerHints(events) {
  let prev = null;
  for (const ev of events) {
    if (ev.rest) { prev = null; continue; }
    if (!ev.fing) continue;
    let show = !prev || ev.notes.length > 1 || prev.notes.length > 1;
    if (!show) {
      const steps = ev.notes[0].d - prev.notes[0].d, df = ev.fing[0] - prev.fing[0];
      const hand = ev.staff === 'b' ? -1 : 1;
      show = !(steps !== 0 && df === steps * hand && Math.abs(steps) <= 2) && !(steps === 0 && df === 0);
    }
    ev.fingShow = show; prev = ev;
  }
}

function computeFingering(song) {
  for (const st of ['t', 'b']) {
    const evs = song.events.filter(e => e.staff === st);
    let afterRest = false;
    const notes = [];
    for (const e of evs) { if (e.rest) { afterRest = true; continue; } e.afterRest = afterRest; afterRest = false; notes.push(e); }
    // в партии одной руки диапазон шире октавы иногда делит на «руки»: скрипичный — правая, басовый — левая
    fingerLine(notes, st === 'b' ? 'L' : 'R');
    markFingerHints(evs);
  }
}

  }

  drawHit(st) {
    const { ctx, sp } = this, x = this.hitX;

    const pu = st.pulse || 0, lw = 3 + 2.5 * pu;

    ctx.fillRect(x - lw / 2, yA, lw, yB - yA); ctx.restore();
    // отсчёт

    const p = st.popup;
    if (p) {
      const age = (st.now - p.t) / 750; if (age < 1) {
        ctx.globalAlpha = 1 - age * age; const y = this.top[this.staves[0]] - 1.6 * sp - age * 10 - 1.4 * sp;
        ctx.fillStyle = p.color; ctx.font = `800 ${Math.round(sp * 1.55)}px ${SERIF}`; ctx.textAlign = 'center';
        ctx.fillText(p.text, x, y);
        if (p.sub) { ctx.fillStyle = C.muted; ctx.font = `500 ${Math.round(sp * 0.9)}px ${MONO}`; ctx.fillText(p.sub, x, y + 1.25 * sp); }
        ctx.globalAlpha = 1;
      }
    }
  }
}

// ===== Режим «страницы»: неподвижный нотный лист =====
const PAGE_THEMES = {
  paper: { paper: '#F2EBDC', ink: '#221C17', muted: '#6E6253', faint: 'rgba(34,28,23,0.5)', line: 'rgba(34,28,23,0.62)', ok: '#2F7D5B', pitch: '#C2412D', rhythm: '#A86A12', accent: '#B8862B', edge: '#CFC5B2' },
  night: { paper: '#1C1815', ink: '#EFE7D6', muted: '#B3A893', faint: 'rgba(239,231,214,0.4)', line: 'rgba(233,226,208,0.42)', ok: '#9AD6B4', pitch: '#F07F68', rhythm: '#E8B65A', accent: '#D9A441', edge: '#16120F' },
};

class PageView extends StaffView {
  constructor(canvas) { super(canvas); this.pageMode = true; }
  setSong(song, opts = {}) { this._warp = {}; this.theme = PAGE_THEMES[opts.sheet] || PAGE_THEMES.paper; super.setSong(song, Object.assign({}, opts, { static: true })); }
  colorOf(ev, i, st) {
    const r = ev.res[i];
    if (r) return (r.r === 'wrong' || r.r === 'miss' || r.r === 'fixed') ? C.pitch : (r.r === 'early' || r.r === 'late') ? C.rhythm : C.ok;
    return C.ink;
  }
  resize() {
    const r = this.cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    this.W = Math.max(300, r.width); this.H = Math.max(200, r.height);
    this.cv.width = Math.round(this.W * dpr); this.cv.height = Math.round(this.H * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!this.song) return;
    const two = this.staves.length === 2, song = this.song;
    const sysU = two ? 15.5 : 4, gapU = two ? 6.5 : 7.5, headU = 11, footU = 3;
    this.sheetX = Math.max(12, (this.W - 1240) / 2); this.sheetW = this.W - 2 * this.sheetX; this.sheetY = 14;
    const avail = this.H - this.sheetY;
    const bps0 = (this.sheetW < 760 ? 2 : this.sheetW < 1000 ? 3 : 4);
    let K = Math.min(two ? 3 : 5, Math.max(1, Math.ceil(song.totalBeats / song.bpb / bps0)));
    while (K > 1 && avail / (headU + K * sysU + (K - 1) * gapU + footU) < 8.5) K--;
    this.sp = Math.max(7, Math.min(14, avail / (headU + K * sysU + (K - 1) * gapU + footU), this.sheetW / 90));
    const sp = this.sp;
    this.K = K; this.sysH = sysU * sp; this.sysGap = gapU * sp; this.headH = headU * sp; this.margin = 5 * sp;
    this.barsPerSys = (this.sheetW < 760 ? 2 : this.sheetW < 1000 ? 3 : 4);
    // первая строка вмещает ещё и вступительные такты с паузами (они узкие), остальные — обычное число тактов
    const nBars = Math.round(song.totalBeats / song.bpb), lead = song.leadIn || 0;

    while (bar < nBars) {
      const cap = this.barsPerSys + (k === 0 ? lead : 0), nb = Math.min(cap, nBars - bar);
      this.systems.push({ k, cap, b0: bar * song.bpb, b1: (bar + nb) * song.bpb, y: this.sheetY + this.headH + (k % K) * (this.sysH + this.sysGap), page: Math.floor(k / K) });

  }
  // нелинейная шкала времени в такте: промежуток между соседними началами нот весит как длительность^0.6
  warp(bar, ib) {
    const song = this.song, bpb = song.bpb; this._warp = this._warp || {};

    if (!m) {
      const on = new Set([0, bpb]); for (const e of song.events) { const r = e.beat - bar * bpb; if (r > 1e-6 && r < bpb - 1e-6) on.add(Math.round(r * 1000) / 1000); }

  }
  sysPanel(k) { const sp = this.sp, n = Math.abs(this.song.key); return 0.8 * sp + 3.4 * sp + n * 1.05 * sp + (k === 0 ? 2.9 * sp : 0.9 * sp); }

  }
  sysGeom(sys) {
    const sp = this.sp, song = this.song, x0 = this.sheetX + this.margin, x1 = this.sheetX + this.sheetW - this.margin, panel = this.sysPanel(sys.k);
    const bw = (x1 - x0 - panel) / (this.barsPerSys);

    const xOf = b => { const rel = b - sys.b0, bar = Math.max(0, Math.min(nb - 1, Math.floor(rel / bpb + 1e-9))), ib = rel - bar * bpb, w = widths[bar]; return x0 + panel + starts[bar] + w * (0.85 + this.warp(firstBar + bar, ib) * (bpb - 0.65) / bpb) / (bpb + 0.45); };

  draw(st) {
    const { ctx, W, H, song } = this; if (!song) return;

  drawSheet(st, T) {
    const { ctx, W, H, sp, song } = this;
    ctx.fillStyle = C_BASE.bg; ctx.fillRect(0, 0, W, H);
    const sx = this.sheetX, sy = this.sheetY, sw = this.sheetW;
    const page = this.pageOf(st.beat);
    if (page < this.pages - 1) { ctx.fillStyle = T.edge; ctx.fillRect(sx + 10, sy + 7, sw, H); }
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12; ctx.fillStyle = T.paper; ctx.fillRect(sx, sy, sw, H); ctx.restore();
    // шапка
    ctx.textAlign = 'center'; ctx.fillStyle = T.ink;
    if (page === 0) {
      ctx.font = `800 ${Math.round(sp * 2.4)}px ${SERIF}`; ctx.fillText(st.title || song.title, sx + sw / 2, sy + 3.3 * sp);
      ctx.font = `italic 500 ${Math.round(sp * 1.2)}px ${SERIF}`; ctx.fillStyle = T.muted; ctx.fillText(st.subtitle || '', sx + sw / 2, sy + 5.1 * sp);
      ctx.textAlign = 'left'; ctx.fillStyle = T.ink; ctx.font = `700 ${Math.round(sp * 1.25)}px ${SERIF}`;
      ctx.fillText(st.mode === 'wait' ? t('page.noTempo') : '♩ = ' + st.bpm, sx + this.margin, sy + this.headH - 1.6 * sp);
    } else {
      ctx.font = `italic 500 ${Math.round(sp * 1.1)}px ${SERIF}`; ctx.fillStyle = T.muted; ctx.fillText(t('page.cont', { t: st.title || song.title }), sx + sw / 2, sy + 3.4 * sp);
    }
    ctx.textAlign = 'right'; ctx.fillStyle = T.muted; ctx.font = `500 ${Math.round(sp * 1.0)}px ${SANS}`;
    ctx.fillText(t('page.of', { i: page + 1, n: this.pages }), sx + sw - this.margin, sy + 3.3 * sp);

      if (sys.page !== page) continue;

      const sysTop = this.top[this.staves[0]], sysBot = this.top[this.staves[this.staves.length - 1]] + 4 * sp;
      // курсор
      if (st.beat >= sys.b0 - (sys.k === 0 ? 99 : 0) && st.beat < sys.b1) {
        const cx = st.beat < 0 ? g.xOf(0) - 1.5 * sp : g.xOf(st.beat);
        const pu = st.pulse || 0;
        ctx.save(); ctx.globalAlpha = 0.13 + 0.1 * pu; ctx.fillStyle = T.accent; ctx.fillRect(cx - 1.3 * sp, sysTop - 2 * sp, 2.6 * sp, sysBot - sysTop + 4 * sp); ctx.restore();
        ctx.fillStyle = T.accent; ctx.fillRect(cx - 1.5 - pu, sysTop - 2 * sp, 3 + 2 * pu, sysBot - sysTop + 4 * sp);

        const k = song.key, n = Math.abs(k), arr = k > 0 ? KS_T.s : KS_T.f, name = k > 0 ? 'sharp' : 'flat';
        for (let i = 0; i < n; i++) { const d = s === 't' ? arr[i] : arr[i] - 14, y = this.yOf(s, d); const h = name === 'flat' ? 2.3 * sp : 2.6 * sp; drawGlyph(ctx, name, cx + 3.4 * sp + i * 1.05 * sp, name === 'flat' ? y - 1.5 * sp : y - h / 2, h); }
        if (sys.k === 0) { const tx = cx + 3.6 * sp + n * 1.05 * sp + 0.9 * sp; ctx.font = `800 ${Math.round(sp * 2.55)}px ${SERIF}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(song.bpb), tx, top + 1.02 * sp); ctx.fillText('4', tx, top + 3.02 * sp); ctx.textBaseline = 'alphabetic'; }
      }
      if (sys.k > 0) { ctx.fillStyle = T.muted; ctx.font = `italic 500 ${Math.round(sp * 1.0)}px ${SERIF}`; ctx.textAlign = 'left'; ctx.fillText(String(sys.b0 / song.bpb + 1 + (song.firstBar || 0)), g.x0, sysTop - 1.3 * sp); }
      for (let b = sys.b0 + song.bpb; b <= sys.b1; b += song.bpb) {
        const x = Math.round(g.barX(Math.round((b - sys.b0) / song.bpb))) - 0.5;

        ctx.strokeStyle = T.ink; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x, sysTop); ctx.lineTo(x, sysBot); ctx.stroke();
      }
      for (const ev of song.events) {
        if (ev.beat < sys.b0 || ev.beat >= sys.b1) continue;

    }

    const anchor = cursorXY || { x: sx + sw / 2, y: sy + 6 * sp, mid: H / 2 };

    const p = st.popup;
    if (p) {

        if (p.sub) { ctx.fillStyle = T.muted; ctx.font = `500 ${Math.round(sp * 0.85)}px ${MONO}`; ctx.fillText(p.sub, anchor.x, y + 1.2 * sp); }
        ctx.globalAlpha = 1;
      }
    }
  }
}

// ===== Звук: метроном, эффекты и простой синтезатор =====
const Snd = {

      apart: [t('pop.apart'), C.rhythm], wrong: [t('pop.wrong'), C.pitch], miss: [t('pop.miss'), C.pitch], extra: [t('pop.extra'), C.pitch], fixed: [t('pop.fixed'), C.muted],
    };
    if (!M[res.r] || (this.mode === 'wait' && res.r === 'perfect')) return;
    const sub = res.r === 'wrong' || res.r === 'extra' ? (res.played != null ? t('pop.played', { n: noteName(spellMidi(res.played, this.song.key)) + (Math.floor(res.played / 12) - 1) }) + (res.reset ? t('pop.reset') : '') : '') : res.r === 'apart' ? t('pop.apartSub') : (res.delta != null && this.mode === 'rhythm' ? ms(res.delta) : '');
    this.popup = { text: M[res.r][0], color: M[res.r][1], sub, t: now };
  }
  loop(now) {
    if (!this.running || this.paused) return;
    let beat, countdown = 0;
    if (this.mode === 'rhythm') {
      beat = (now - (this.settings.visualOffset || 0) - this.startPerf) / this.beatMs;
      const lead = (this.song.leadIn || 0) * this.song.bpb; if (beat < lead) countdown = Math.ceil(lead - beat - 1e-6);
      while (this.nextClick <= this.song.totalBeats && this.startPerf + this.nextClick * this.beatMs < now + 200) {
        const b = this.nextClick;
        if (b < (this.song.leadIn || 0) * this.song.bpb || this.settings.metronome) Snd.click(this.startPerf + b * this.beatMs, ((b % this.song.bpb) + this.song.bpb) % this.song.bpb === 0, this.settings.metroVol);
        this.nextClick++;
      }
      if (this.demo) this.autoplay(now);
      const missed = this.judge.tick(now - this.startPerf - (this.demo ? 0 : this.offset));
      if (missed.length) this.showPopup({ r: 'miss' });

    } else {
      const dt = now - this.last; this.last = now;
      const target = this.judge.pendingBeat;

    const pulse = this.mode === 'rhythm' && beat > -this.song.bpb - 0.01 && beat < this.song.totalBeats ? Math.max(0, 1 - (beat - Math.floor(beat)) * 4) : 0;
    this.view.draw({ beat, mode: this.mode, pendingBeat: this.judge.pendingBeat, nextBeat: this.judge.nextBeat(), popup: this.popup, now, countdown, pulse, bpm: this.bpm, hidden: this.hidden || 0 });

  // демо: звук нот заранее ставится в очередь по тем же часам, что и метроном
  autoplay(now) {
    const t = now - this.startPerf;
    if (!this.demoSched) this.demoSched = new Set();
    for (const n of this.judge.notes) {
      if (n.time > t + 200) break;
      if (this.demoSched.has(n)) continue;
      this.demoSched.add(n);
      Snd.playNote(n.midi, 0.6, this.startPerf + n.time, n.ev.dur * this.beatMs * 0.92);
    }
    for (const n of this.judge.notes) {
      if (n.time > t) break;

      const res = this.judge.hit(n.midi, n.time);

      setTimeout(() => { if (this.demo && this.running) this.onKey && this.onKey(m, null); }, off);

  }
  finish() { this.stop(); const s = this.judge.summary(this.settings.names); if (this.hidden) { s.score = Math.round(s.score * 1.1); s.hidden = this.hidden; } this.onFinish && this.onFinish(s); }
}

// ===== Разбор ошибок после упражнения (чистая логика, без DOM) =====
// Ищет повторяющиеся закономерности и самые трудные такты.
const TIP_MIN = 2; // закономерность показываем, только если она повторилась хотя бы дважды

// какие знаки нарисованы перед нотами (как в StaffView.setSong)
function shownAccidentals(song) {
  const eff = {}, out = new Map();
  for (const ev of song.events) {
    if (ev.rest) continue;
    const bar = Math.floor(ev.beat / song.bpb + 1e-9);
    out.set(ev, ev.notes.map(n => {
      const k = ev.staff + ':' + bar + ':' + n.d, def = keyAlt(song.key, ((n.d % 7) + 7) % 7), cur = k in eff ? eff[k] : def;
      if (n.alt === cur) return null; eff[k] = n.alt; return n.alt;
    }));
  }
  return out;
}
const isLedger = (staff, d) => staff === 't' ? (d <= 28 || d >= 40) : (d <= 16 || d >= 28);
const mod7 = x => ((x % 7) + 7) % 7;
// как называется нажатая клавиша: белая — без знака, чёрная — с диезом (или бемолем в бемольных тональностях)
function plainSpell(midi, key) { const pc = ((midi % 12) + 12) % 12, oct = Math.floor(midi / 12) - 1, W = [0, 2, 4, 5, 7, 9, 11];
  let l = W.indexOf(pc); if (l >= 0) return { d: oct * 7 + l, alt: 0 };
  if (key < 0) { l = W.indexOf(pc + 1); return { d: oct * 7 + l, alt: -1 }; } l = W.indexOf(pc - 1); return { d: oct * 7 + l, alt: 1 }; }

// Классификация одной нотной ошибки: что ожидали, что сыграли
function classifyWrong(song, acc, note, played) {
  const ev = note.ev, nn = ev.notes[note.i], letter = mod7(nn.d), ka = keyAlt(song.key, letter);
  const shown = (acc.get(ev) || [])[note.i];
  const nat = midiOf(nn.d, 0), withKey = midiOf(nn.d, ka);
  if (nn.alt !== 0 && played === nat) {
    if (shown != null) return 'accMissed';                 // знак стоит прямо перед нотой — не заметили
    return nn.alt === ka ? 'keysig' : 'carry';              // знак при ключе или знак, стоящий раньше в такте
  }
  if (nn.alt !== ka && played === withKey) return shown != null ? 'natural' : 'carry'; // забыли бекар (или его действие до конца такта)
  if (played % 12 === note.midi % 12) return 'octave';
  const sp = plainSpell(played, song.key), dd = sp.d - nn.d;
  if (ev.staff === 'b' && mod7(dd) === 5 && Math.abs(dd) <= 9) return 'clef';
  if (Math.abs(dd) === 1) return dd > 0 ? 'secondUp' : 'secondDown';
  return 'other';
}

function analyzeRun(judge, song, opts = {}) {
  const acc = shownAccidentals(song), bpb = song.bpb, nBars = Math.max(1, Math.round(song.totalBeats / bpb));
  const barOf = beat => Math.max(0, Math.min(nBars - 1, Math.floor(beat / bpb + 1e-9)));
  const barErr = new Array(nBars).fill(0);
  const cnt = {}, ex = {}, add = (k, e) => { cnt[k] = (cnt[k] || 0) + 1; if (e && !ex[k]) ex[k] = e; };
  const staffErr = { t: 0, b: 0 }; let pitchErr = 0, ledgerErr = 0;
  const wait = judge.mode === 'wait';
  for (const L of judge.log) {
    if (L.kind === 'extra') { if (!wait) barErr[barOf(L.beat)]++; continue; }
    const n = L.note; if (!n) continue;
    barErr[barOf(n.beat)]++;
    if (L.kind === 'apart') { add('apart'); continue; }
    if (L.kind === 'miss') { add('miss'); staffErr[n.ev.staff]++; continue; }
    if (L.kind === 'wrong') {
      pitchErr++; staffErr[n.ev.staff]++;
      const nn = n.ev.notes[n.i];
      if (isLedger(n.ev.staff, nn.d)) ledgerErr++;
      const k = classifyWrong(song, acc, n, L.played);
      add(k, { want: noteName(nn), got: noteName(plainSpell(L.played, song.key)), bar: barOf(n.beat) + 1 });
    }
  }
  // ритм: ранние и поздние попадания
  const hits = judge.notes.filter(n => n.res && n.res.delta != null && n.res.r !== 'wrong');
  for (const n of hits) if (n.res.r === 'early' || n.res.r === 'late') barErr[barOf(n.beat)]++;
  // неполные созвучия в темпе: часть нот взята, часть нет
  if (!wait) {
    const byEv = new Map();
    for (const n of judge.notes) { if (n.ev.notes.length < 2) continue; if (!byEv.has(n.ev)) byEv.set(n.ev, []); byEv.get(n.ev).push(n); }
    for (const ns of byEv.values()) { const ok = ns.filter(n => n.res && n.res.r !== 'miss' && n.res.r !== 'wrong').length; if (ok > 0 && ok < ns.length) add('chordPart'); }
  }

  const tips = [];
  const T = (key, n, vars, w) => tips.push({ key, n, vars: Object.assign({ n }, vars || {}), w: w ?? n });
  for (const k of ['keysig', 'carry', 'accMissed', 'natural', 'octave', 'clef']) if ((cnt[k] || 0) >= TIP_MIN) T('tip.' + k, cnt[k], ex[k], cnt[k] + 0.5);
  const sec = (cnt.secondUp || 0) + (cnt.secondDown || 0);
  if (sec >= TIP_MIN) T('tip.second', sec, { dir: t((cnt.secondUp || 0) >= (cnt.secondDown || 0) ? 'tip.dirUp' : 'tip.dirDown') });
  if (ledgerErr >= TIP_MIN && ledgerErr / Math.max(1, pitchErr) >= 0.5) T('tip.ledger', ledgerErr, { all: pitchErr });
  if (song.staves === 'tb') {
    const tot = staffErr.t + staffErr.b;
    for (const s of ['t', 'b']) if (tot >= 3 && staffErr[s] >= TIP_MIN && staffErr[s] / tot >= 0.7) T(s === 't' ? 'tip.handR' : 'tip.handL', staffErr[s], { p: Math.round(staffErr[s] / tot * 100) }, staffErr[s] - 0.5);
  }
  if ((cnt.chordPart || 0) >= TIP_MIN) T('tip.chordPart', cnt.chordPart);
  if ((cnt.apart || 0) >= TIP_MIN) T('tip.apart', cnt.apart);
  // ритмические закономерности
  if (!wait && hits.length >= 4) {
    const avg = a => a.reduce((s, n) => s + n.res.delta, 0) / a.length, all = avg(hits);
    const prevEv = new Map();
    for (const st of ['t', 'b']) { let prev = null; for (const ev of song.events) { if (ev.staff !== st) continue; prevEv.set(ev, prev); prev = ev; } }
    const afterRest = hits.filter(n => { const p = prevEv.get(n.ev); return p && (p.rest || p.dur >= 2); });
    const downs = hits.filter(n => n.beat > 0 && Math.abs(n.beat % bpb) < 1e-6);
    if (afterRest.length >= TIP_MIN && avg(afterRest) < -40 && avg(afterRest) < all - 20) T('tip.rushRest', afterRest.length, { v: Math.round(-avg(afterRest)) });
    if (downs.length >= TIP_MIN && avg(downs) > 40 && avg(downs) > all + 20) T('tip.lateDown', downs.length, { v: Math.round(avg(downs)) });
    if (opts.pageBars) {
      const turn = judge.notes.filter(n => { const b = barOf(n.beat); return b > 0 && b % opts.pageBars === 0 && n.res && (n.res.r === 'late' || n.res.r === 'miss' || n.res.r === 'wrong'); });
      if (turn.length >= TIP_MIN) T('tip.pageTurn', turn.length);
    }
    if (Math.abs(all) >= 25) T(all < 0 ? 'tip.rush' : 'tip.drag', hits.length, { v: Math.round(Math.abs(all)) }, 1.5);
  }
  tips.sort((a, b) => b.w - a.w);

  // самый трудный кусок: такт с наибольшим числом ошибок (+ соседний, если там тоже много)
  let worst = null; const max = Math.max(...barErr);
  if (max > 0) {
    const b = barErr.indexOf(max); let a = b, z = b;
    if (b + 1 < nBars && barErr[b + 1] * 2 >= max && barErr[b + 1] >= (b > 0 ? barErr[b - 1] : 0)) z = b + 1;
    else if (b > 0 && barErr[b - 1] * 2 >= max) a = b - 1;
    worst = { a, z, from: Math.max(0, a - 1), to: Math.min(nBars - 1, z + 1), errors: barErr.slice(a, z + 1).reduce((s, v) => s + v, 0) };
  }
  return { tips: tips.slice(0, 3), barErr, worst, nBars, counts: cnt };
}

// Вырезать такты [from..to] в отдельную пьесу для фрагментной тренировки
function subSong(song, from, to) {
  const bpb = song.bpb, b0 = from * bpb, b1 = (to + 1) * bpb;
  const events = song.events.filter(e => e.beat >= b0 - 1e-9 && e.beat < b1 - 1e-9).map(e => ({ beat: e.beat - b0, dur: Math.min(e.dur, b1 - e.beat), staff: e.staff, rest: e.rest, notes: e.notes.map(n => ({ d: n.d, alt: n.alt })) }));
  return { title: song.title, bpm: song.bpm, bpb, key: song.key, staves: song.staves, events, totalBeats: b1 - b0, fingering: song.fingering, firstBar: from };
}

if (typeof module !== 'undefined') module.exports = { analyzeRun, classifyWrong, subSong, shownAccidentals };

// ===== Управление с MIDI =====
// В меню: первая октава (по умолчанию C4–B5). C4 — главное действие, чёрные клавиши — постоянные действия,
// белые D4…B5 — пункты на экране по порядку. В игре: самая нижняя клавиша — пауза, следующая белая — «заново» (удерживать).
const NAV_KEYS = { primary: 0, back: 1, again: 3, prev: 6, next: 8, demo: 10, metro: 13, view: 15, help: 18, settings: 20 };
const NAV_WHITE = [2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23];
const LEGEND_ACTS = ['primary', 'back', 'again', 'prev', 'next', 'demo', 'help', 'settings'];
const PC_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const midiLabel = m => PC_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const isBlackKey = m => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);
const kbadgeHtml = (m, cls) => `<span class="kbadge${cls ? ' ' + cls : ''}" aria-hidden="true"><i class="${isBlackKey(m) ? 'bk' : 'wk'}"></i>${midiLabel(m)}</span>`;

function toast(text) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = text; el.classList.add('on'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('on'), 1800);
}

const Nav = {
  map: new Map(), until: 0,
  navBase() { return S.navOct ?? 60; },
  keyOf(act) { return this.navBase() + NAV_KEYS[act]; },
  low() { return S.zoneBase ?? 21; },
  pauseKey() { return this.low(); },
  retryKey() { const l = this.low(); return isBlackKey(l + 1) ? l + 2 : l + 1; },
  newKey() { const r = this.retryKey(); return isBlackKey(r + 1) ? r + 2 : r + 1; },
  // в игре служебные только клавиши паузы и «заново»; ноты упражнений всегда выше
  isZone(m) { return S.midiNav !== false && (m === this.pauseKey() || m === this.retryKey() || m === this.newKey()); },
  minD() { const r = this.newKey(), W = [0, 2, 4, 5, 7, 9, 11]; return (Math.floor(r / 12) - 1) * 7 + W.indexOf(r % 12) + 1; },
  on() { return S.midiNav !== false && Input.status === 'ok'; },
  hold(ms = 1000) { this.until = performance.now() + ms; },
  init() {
    GEN_MIN_D = this.minD();
    Input.on(e => {
      if (e.type !== 'on') { if (e.src === 'midi' && (e.midi === this.retryKey() || e.midi === this.newKey())) Retry.up(); return; }
      if (Cal.measuring) { Cal.tap(e); return; }
      if (Onb.active) { Onb.handle(e); return; }
      if (e.src !== 'midi' || S.midiNav === false) return;
      this.press(e.midi);
    });
  },
  root() {
    for (const id of ['helpOv', 'calOv', 'onbOv', 'keyOv', 'pauseOv']) { const o = document.getElementById(id); if (o && o.classList.contains('on')) return o; }
    return document.querySelector('.scr.on');
  },
  visible(el) { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && !el.disabled && !el.closest('[disabled]'); },
  badge(el, m, extra) { el.insertAdjacentHTML('beforeend', kbadgeHtml(m, extra)); },
  // расставить подписи на текущем экране и запомнить, какая клавиша что делает
  label() {
    document.querySelectorAll('.kbadge:not(.static)').forEach(b => b.remove());
    document.querySelectorAll('.kb-host').forEach(b => b.classList.remove('kb-host'));
    this.map = new Map();
    document.body.classList.toggle('midinav', this.on());
    const root = this.root();
    if (!root || (current === 'game' && root.classList.contains('scr'))) { this.legend(null); return; }
    const nb = this.navBase(), acts = new Set();
    root.querySelectorAll('[data-act]').forEach(el => {
      if (!this.visible(el) || !(el.dataset.act in NAV_KEYS)) return; const m = nb + NAV_KEYS[el.dataset.act]; if (this.map.has(m)) return;
      this.map.set(m, { el }); acts.add(el.dataset.act); if (this.on()) { el.classList.add('kb-host'); this.badge(el, m); }
    });
    let k = 0;
    root.querySelectorAll('[data-li],[data-li-range]').forEach(el => {
      if (!this.visible(el)) return;
      if (el.hasAttribute('data-li-range')) {
        if (k + 1 >= NAV_WHITE.length) return;
        const a = nb + NAV_WHITE[k++], b = nb + NAV_WHITE[k++];
        this.map.set(a, { el, step: -1 }); this.map.set(b, { el, step: 1 });
        if (this.on()) { const host = el.parentElement; host.classList.add('kb-host'); this.badge(host, a, 'kb-l'); this.badge(host, b, 'kb-r'); }
      } else {
        if (k >= NAV_WHITE.length) return;
        const m = nb + NAV_WHITE[k++]; this.map.set(m, { el });
        if (this.on()) { const host = el.tagName === 'SELECT' ? el.parentElement : el; host.classList.add('kb-host'); this.badge(host, m); }
      }
    });
    this.legend(root.classList.contains('scr') ? root : null, acts);
  },
  // нижняя панель: какие постоянные клавиши работают на этом экране
  legend(root, acts) {
    document.querySelectorAll('[data-legend]').forEach(l => { l.innerHTML = ''; });
    if (!root || !this.on()) return;
    const box = root.querySelector('[data-legend]'); if (!box) return;
    const nb = this.navBase(), list = LEGEND_ACTS.filter(a => a === 'help' || (a === 'settings' && current !== 'settings') || acts.has(a));
    box.innerHTML = list.map(a => `<span>${kbadgeHtml(nb + NAV_KEYS[a], 'static')}${esc(t('leg.' + a))}</span>`).join('');
  },
  relabel() { cancelAnimationFrame(this._r); this._r = requestAnimationFrame(() => this.label()); },
  activate(el, step) {
    if (step) { const st = +el.step || 1; el.value = +el.value + step * st; el.dispatchEvent(new Event('input', { bubbles: true })); return; }
    if (el.tagName === 'SELECT') { el.selectedIndex = (el.selectedIndex + 1) % el.options.length; el.dispatchEvent(new Event('change', { bubbles: true })); return; }
    el.classList.add('kb-flash'); setTimeout(() => el.classList.remove('kb-flash'), 180);
    el.click();
  },
  press(m) {
    const pk = this.pauseKey(), rk = this.retryKey(), nk = this.newKey(), game_ = current === 'game';
    const pauseOn = document.getElementById('pauseOv').classList.contains('on');
    // в игре: только пауза и «заново»
    if (game_ && !pauseOn && !document.getElementById('helpOv').classList.contains('on')) {
      if (m === pk) pauseGame(); else if (m === rk) Retry.down('same'); else if (m === nk) Retry.down('new');
      return;
    }
    if (m !== pk && m !== rk && m !== nk && performance.now() < this.until) return; // защита от случайных нажатий после смены экрана
    const off = m - this.navBase(), act = Object.keys(NAV_KEYS).find(a => NAV_KEYS[a] === off);
    const help = document.getElementById('helpOv').classList.contains('on');
    if (act === 'help') { help ? closeHelp() : openHelp(); return; }
    if (help) { if (act === 'back' || act === 'primary') closeHelp(); return; }
    if (pauseOn) {
      if (m === pk) { document.getElementById('pResume').click(); return; }
      if (m === rk) { document.getElementById('pRestart').click(); return; }
      if (m === nk) { const b = document.getElementById('pNew'); if (b.offsetParent) b.click(); return; }
    }
    if (act === 'settings') { if (current === 'settings') closeSettings(); else openSettings(); return; }
    if (m === rk && current === 'results') { const b = document.querySelector('#rActions [data-act="again"]'); if (b) b.click(); return; }
    const hit = this.map.get(m);
    if (hit) { this.activate(hit.el, hit.step); return; }
    if (act === 'back') { if (current !== 'home') go('home'); return; }
    if (act === 'view') return toggleView();
    if (act === 'metro') return toggleMetro();
  },
};

// ===== «Заново» удержанием (как в osu): пробел или вторая снизу белая клавиша, ~0,3 с =====
const RETRY_MS = 300;
const Retry = {
  t0: 0, raf: 0, kind: 'same',
  down(kind) {
    if (this.t0 || current !== 'game' || !game || !game.running || game.paused) return;
    this.kind = kind === 'new' && lastStart && lastStart.regen ? 'new' : 'same';
    document.getElementById('retryTxt').textContent = t(this.kind === 'new' ? 'g.newing' : 'g.retrying');
    this.t0 = performance.now();
    const ov = document.getElementById('retryOv'), ring = document.getElementById('retryRing');
    const step = now => {
      if (!this.t0) return;

// картинка октавы управления: какие клавиши что делают
function navKeysSvg() {
  const nb = Nav.navBase(), kw = 34, H = 118, whites = [], out = [];
  for (let m = nb; m < nb + 24; m++) if (!isBlackKey(m)) whites.push(m);
  const W = whites.length * kw;
  out.push(`<svg viewBox="0 0 ${W} ${H + 34}" style="width:100%;max-width:${W}px;display:block;margin:0 auto" role="img" aria-label="${esc(t('onb.nav.aria'))}">`);
  const lab = m => { const off = m - nb; const a = Object.keys(NAV_KEYS).find(k => NAV_KEYS[k] === off); if (a) return t('key.' + a); const i = NAV_WHITE.indexOf(off); return i >= 0 ? String(i + 1) : ''; };
  whites.forEach((m, i) => {
    const prim = m === nb;
    out.push(`<rect x="${i * kw + 1}" y="0" width="${kw - 2}" height="${H}" rx="3" fill="${prim ? '#D9A441' : '#EFE7D6'}"/>`);
    out.push(`<text x="${i * kw + kw / 2}" y="${H - 10}" text-anchor="middle" font-size="${prim ? 10 : 12}" font-weight="700" fill="#221C17" font-family="Inter,sans-serif">${esc(lab(m))}</text>`);
    if (m % 12 === 0) out.push(`<text x="${i * kw + kw / 2}" y="${H + 16}" text-anchor="middle" font-size="11" fill="#B3A893" font-family="JetBrains Mono,monospace">${midiLabel(m)}</text>`);
  });
  whites.forEach((m, i) => {
    if (!isBlackKey(m + 1) || m + 1 >= nb + 24) return;
    const x = (i + 1) * kw, l = lab(m + 1);
    out.push(`<rect x="${x - 11}" y="0" width="22" height="${H * 0.62}" rx="2" fill="${l ? '#8A6A2A' : '#120F0D'}" stroke="#3a322c"/>`);
    if (l) out.push(`<text x="${x}" y="${H * 0.62 + 14}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#E8C77A" font-family="Inter,sans-serif">${esc(l)}</text>`);
  });
  out.push('</svg>'); return out.join('');
}

// Устойчивая оценка: медиана, отбрасываем выбросы (дальше 3 MAD, но не ближе 35 мс), затем среднее и разброс
function calStats(ds) {
  const xs = ds.filter(d => d != null); if (!xs.length) return null;
  const sorted = xs.slice().sort((a, b) => a - b), med = sorted[sorted.length >> 1];
  const mad = [...xs.map(d => Math.abs(d - med))].sort((a, b) => a - b)[xs.length >> 1] || 0;
  const lim = Math.max(35, 3 * 1.4826 * mad);
  const kept = xs.filter(d => Math.abs(d - med) <= lim);
  const mean = kept.reduce((a, b) => a + b, 0) / kept.length;
  const sd = Math.sqrt(kept.reduce((a, d) => a + (d - mean) * (d - mean), 0) / Math.max(1, kept.length - 1));
  return { mean: Math.round(mean), sd: Math.round(sd), kept: kept.length, total: xs.length, lim, med };
}

// график: точки нажатий относительно щелчка, линия средней задержки и полоса разброса

  const L = 48, R = W - 12, T = 12, B = H - 30;
  const y = v => T + (hi - v) / (hi - lo) * (B - T), x = i => L + (i + 0.5) / slots.length * (R - L);
  ctx.font = '11px JetBrains Mono, monospace'; ctx.textBaseline = 'middle';
  // сетка
  const step = hi - lo > 200 ? 50 : 20;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) { ctx.strokeStyle = 'rgba(233,226,208,.07)'; ctx.beginPath(); ctx.moveTo(L, y(v)); ctx.lineTo(R, y(v)); ctx.stroke(); ctx.fillStyle = '#7E7364'; ctx.textAlign = 'right'; ctx.fillText((v > 0 ? '+' : '') + v, L - 8, y(v)); }

  ctx.fillStyle = 'rgba(217,164,65,.14)'; ctx.fillRect(L, y(st.mean + st.sd), R - L, y(st.mean - st.sd) - y(st.mean + st.sd));
  ctx.strokeStyle = '#8a7a62'; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(L, y(0)); ctx.lineTo(R, y(0)); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = '#D9A441'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(L, y(st.mean)); ctx.lineTo(R, y(st.mean)); ctx.stroke(); ctx.lineWidth = 1;
  ctx.textAlign = 'right'; ctx.fillStyle = '#B3A893'; ctx.fillText(t('cal.clickLine'), R - 4, y(0) + (st.mean >= 0 ? 10 : -10));
  ctx.fillStyle = '#D9A441'; ctx.fillText(t('cal.meanLine', { v: fmtMs(st.mean) }), R - 4, y(st.mean) + (st.mean >= 0 ? -10 : 10));
  // точки
  slots.forEach((d, i) => {
    ctx.fillStyle = '#7E7364'; ctx.textAlign = 'center'; ctx.fillText(String(i + 1), x(i), B + 12);
    if (d == null) return;

  });
  ctx.fillStyle = '#7E7364'; ctx.textAlign = 'left'; ctx.fillText(t('cal.axis'), L, H - 6);
}

function accCard(card, val, v, need, ok) {
  const el = $(card); el.classList.remove('good', 'fail', 'na');
  $(val).textContent = v == null ? t('r.notRated') : pct(v);

  if (need == null) { mark.style.display = 'none'; nd.textContent = ''; return; }
  mark.style.display = ''; mark.style.left = (need * 100) + '%';
  el.classList.add(ok ? 'good' : 'fail'); nd.textContent = t(need >= 1 ? 'r.needAll' : 'r.need', { v: Math.round(need * 100) });
}
function drawHist(cv, deltas, win) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, W = r.width, H = r.height, ctx = cv.getContext('2d');
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const R = 150, bins = 15, bw = 2 * R / bins, cnt = new Array(bins).fill(0);
  deltas.forEach(d => { const i = Math.max(0, Math.min(bins - 1, Math.floor((d + R) / bw))); cnt[i]++; });
  const mx = Math.max(1, ...cnt), gap = 3, w = (W - gap * (bins - 1)) / bins;
  cnt.forEach((n, i) => {
    const mid = -R + (i + 0.5) * bw, a = Math.abs(mid);
    ctx.fillStyle = a <= win.perfect ? '#7ED9A0' : a <= win.great ? '#B7E6C4' : a <= win.good ? '#E8D08A' : '#E8B65A';
    const h = n ? Math.max(3, n / mx * (H - 6)) : 2; ctx.globalAlpha = n ? 1 : 0.3;

function renderWhere(sum, o) {

  if (L) { an.barErr = an.barErr.slice(L); if (an.worst) { const nb = an.barErr.length, c = v => Math.max(0, Math.min(nb - 1, v - L)); an.worst = Object.assign({}, an.worst, { a: c(an.worst.a), z: c(an.worst.z), from: c(an.worst.from), to: c(an.worst.to) }); } }

  mk(t('frag.play', { a: fw.from + 1, b: fw.to + 1 }), () => startFragment(base, fw, {}));

  return an;
}
